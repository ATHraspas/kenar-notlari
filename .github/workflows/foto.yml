name: Fotoğrafları indir
on:
  push:
    paths: ["foto/kaynak.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: İndir ve küçült
        run: |
          python3 - <<'PY'
          import json, os, io, time, urllib.request
          from PIL import Image
          src = json.load(open("foto/kaynak.json"))
          for pid, f in src.items():
              out = f"foto/{pid}.jpg"
              if os.path.exists(out): continue
              url = f["url"].split("?")[0]
              req = urllib.request.Request(url, headers={"User-Agent": "KenarNotlari/1.0 (https://github.com/ATHraspas/kenar-notlari)"})
              data = None
              for deneme in range(5):
                  try:
                      data = urllib.request.urlopen(req, timeout=60).read(); break
                  except Exception as e:
                      print("tekrar", pid, e); time.sleep(10 * (deneme + 1))
              time.sleep(3)
              try:
                  im = Image.open(io.BytesIO(data)).convert("RGB")
                  im.thumbnail((520, 700))
                  im.save(out, "JPEG", quality=82, optimize=True, progressive=True)
                  print("ok", pid, im.size)
              except Exception as e:
                  print("HATA", pid, e)
          PY
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add foto
          git diff --cached --quiet || git commit -m "Fotoğraflar indirildi"
          git push
